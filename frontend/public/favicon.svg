<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 棋盘背景 -->
  <rect width="100" height="100" rx="12" fill="#DEB887"/>
  
  <!-- 棋盘线条 -->
  <g stroke="#8B7355" stroke-width="1.5">
    <!-- 横线 -->
    <line x1="20" y1="20" x2="80" y2="20"/>
    <line x1="20" y1="35" x2="80" y2="35"/>
    <line x1="20" y1="50" x2="80" y2="50"/>
    <line x1="20" y1="65" x2="80" y2="65"/>
    <line x1="20" y1="80" x2="80" y2="80"/>
    <!-- 竖线 -->
    <line x1="20" y1="20" x2="20" y2="80"/>
    <line x1="35" y1="20" x2="35" y2="80"/>
    <line x1="50" y1="20" x2="50" y2="80"/>
    <line x1="65" y1="20" x2="65" y2="80"/>
    <line x1="80" y1="20" x2="80" y2="80"/>
  </g>
  
  <!-- 黑子 -->
  <circle cx="35" cy="35" r="11" fill="#1a1a1a">
    <animate attributeName="opacity" values="0;1" dur="0.3s" fill="freeze"/>
  </circle>
  <ellipse cx="32" cy="32" rx="4" ry="3" fill="#444" opacity="0.6"/>
  
  <!-- 白子 -->
  <circle cx="50" cy="50" r="11" fill="#f5f5f5" stroke="#ccc" stroke-width="0.5">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.1s" fill="freeze"/>
  </circle>
  <ellipse cx="47" cy="47" rx="4" ry="3" fill="#fff" opacity="0.8"/>
  
  <!-- 黑子2 -->
  <circle cx="65" cy="35" r="11" fill="#1a1a1a">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.2s" fill="freeze"/>
  </circle>
  <ellipse cx="62" cy="32" rx="4" ry="3" fill="#444" opacity="0.6"/>
</svg>
